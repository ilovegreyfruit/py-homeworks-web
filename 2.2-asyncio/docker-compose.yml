version: '3.8'

services:
  db:
    image: postgres:15
    container_name: swapi_pg
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 663K1i8r
      POSTGRES_DB: swapi_db
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: swapi_loader
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=swapi_db
      - DB_USER=postgres
      - DB_PASSWORD=663K1i8r
    command: ["python", "load_data.py"]
    volumes:
      - .:/code

volumes:
  pgdata: